<text x="901.0" y="248" fill="#B8C7DD" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="14">Modules, case studies,</text>
<text x="901.0" y="266" fill="#B8C7DD" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="14">applications</text>
