<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="court-t court-d">
<title id="court-t">The team as a volleyball court</title>
<desc id="court-d">A top-down volleyball court. On the bench: the head coach (me), the assistant coach (Claude), the playbook and the timeout whistle. The morning scouts warm up on our side, the line judge stands at the net post so nothing crosses unchecked, and the finished work goes over the net.</desc>
