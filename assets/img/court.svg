<circle cx="70" cy="160" r="13" fill="#E0A672"/>
<text x="94" y="158" fill="#F7F4EE" font-family="Instrument Serif, Georgia, serif" font-size="24" text-anchor="start">Head coach</text>
<text x="94" y="180" fill="#B8C7DD" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="14" text-anchor="start">Me: decides and</text>
<text x="94" y="198" fill="#B8C7DD" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="14" text-anchor="start">signs off</text>
<circle cx="70" cy="260" r="13" fill="#F7F4EE"/>
<text x="94" y="258" fill="#F7F4EE" font-family="Instrument Serif, Georgia, serif" font-size="24" text-anchor="start">Assistant coach</text>
<text x="94" y="280" fill="#B8C7DD" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="14" text-anchor="start">Claude: runs the</text>
<text x="94" y="298" fill="#B8C7DD" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="14" text-anchor="start">playbook</text>
<g transform="translate(58,340)"><rect x="0" y="0" width="26" height="34" rx="4" fill="#A8743F"/><rect x="4" y="6" width="18" height="24" rx="2" fill="#FBFBF9"/><rect x="8" y="-3" width="10" height="6" rx="2" fill="#C9CDD3"/></g>
<text x="94" y="355" fill="#F7F4EE" font-family="Instrument Serif, Georgia, serif" font-size="24">The Playbook</text>
<text x="94" y="375" fill="#B8C7DD" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="14">Memory &amp; standards</text>
