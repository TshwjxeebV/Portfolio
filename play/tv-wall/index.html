<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The TV Wall · Sales Simulator</title>
<meta name="description" content="A capstone sales simulator: help five customers on the sales floor with the D.I.S.C. framework. Portfolio sample by Tshwjxeeb Vaaj.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1F45'/%3E%3Crect x='12' y='18' width='40' height='24' rx='3' fill='%23F2B600'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --panel-2:#F1F4F8; --line:#D8DEE7; --text:#18212F; --muted:#5A6476;
  --blue:#0A4ABF; --blue-2:#0B5BE0; --blue-50:#EAF1FD; --navy:#0B1F45; --gold:#F2B600; --green:#137A3F; --red:#C42B2B;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
h1,h2,h3{font-family:Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){.msg{animation:none!important}}

/* LMS top bar */
.topbar{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.tb-in{max-width:1240px;margin:0 auto;padding:0 32px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.org{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.01em}
.logo{width:26px;height:18px;border-radius:2px;background:var(--gold);position:relative;flex:0 0 auto}
.logo::after{content:"";position:absolute;inset:4px 5px;background:var(--navy);border-radius:1px}
.org .sep{opacity:.45}
.org .dim{color:#B8C4DA;font-weight:500}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px 48px}

/* module header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px 0 14px;border-bottom:1px solid var(--line)}
.brand .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.brand .s{font-size:18px;font-weight:700;color:var(--text);margin-top:2px}
.brand .s:empty{display:none}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-top:4px}
.back:hover{color:var(--blue)}
.phases{display:flex;gap:0;list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel);counter-reset:ph}
.phases li{counter-increment:ph;font-size:12px;font-weight:600;padding:7px 14px;color:var(--muted);border-left:1px solid var(--line)}
.phases li:first-child{border-left:0}
.phases li::before{content:counter(ph) ". "}
.phases li.cur{background:var(--blue);color:#fff}
.phases li.done{background:var(--blue-50);color:var(--blue)}
.phases li.done::before{content:"\2713  "}
.prog{height:6px;background:#E1E6EE;border-radius:3px;margin:14px 0 22px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s ease}
.progl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:14px}
.progl b{color:var(--text);font-weight:600}
.progl + .prog{margin-top:6px}
.score{display:flex;gap:16px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.1em;color:#B8C4DA}
.score b{font:700 18px Inter,sans-serif;margin-left:6px;vertical-align:-1px;color:#fff}
.score .kept b{color:#5BD08A} .score .ret b{color:#FF8A80}
.bump{display:inline-block;animation:bump .5s}
@keyframes bump{50%{transform:scale(1.35)}}

/* welcome */
.center{max-width:720px;margin:6vh auto 0;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:36px 36px 30px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--blue);text-transform:uppercase;margin-bottom:10px}
.center h1{font-size:clamp(30px,4vw,40px);font-weight:700;margin-bottom:14px}
.center p{color:var(--muted);font-size:16px}
.disc{display:flex;justify-content:center;gap:10px;margin:22px 0}
.disc div{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:12px 16px;min-width:84px}
.disc b{display:block;font:700 26px Inter,sans-serif;color:var(--blue)}
.disc span{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.hint{color:var(--text)!important;font-size:14px!important;background:#FFF7DB;border:1px solid #F1DC98;border-radius:4px;padding:10px 14px;text-align:left}
.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:4px;padding:11px 20px;font-weight:600;transition:background .15s}
.btn:hover{background:var(--blue-2)}
.btn.ghost{background:var(--panel);color:var(--blue);border-color:var(--line)}
.btn.ghost:hover{background:var(--blue-50);border-color:var(--blue)}

/* sim layout */
.sim{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.prof{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;position:sticky;top:16px}
.prof .lab0{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.av{width:72px;height:72px;border-radius:50%;overflow:hidden;border:2px solid var(--blue);background:var(--blue-50);margin-bottom:12px;flex:0 0 auto}
.av svg{display:block;width:100%;height:100%}
.prof h2{font-size:19px;font-weight:700}
.prof .role{color:var(--muted);font-size:14px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12px;color:var(--muted)}
.notes{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.notes .lab{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.notes ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text)}

.page{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px;animation:turn .3s ease both}
@keyframes turn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}
.pagebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pagebar .pg{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.pagebar .pg b{color:var(--text)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.dots i.done{background:#9DB5E3}
.dots i.cur{background:var(--blue)}
.log{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}

/* page-to-page navigation */
.pnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.pnav .btn{padding:8px 14px;font-size:14px;min-width:96px}
.pnav .sp{min-width:96px}
.review{font-size:13px;font-weight:600;color:#7A5A00;background:#FFF7DB;border:1px solid #F1DC98;border-radius:4px;padding:8px 12px;margin:0 0 12px}

.msg{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;padding:12px 16px;scroll-margin-top:16px}
.msg.new{animation:pop .3s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .who{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-bottom:6px}
.msg.cust{border-left-color:var(--gold);background:#FFFCF2}
.msg.cust .who{background:var(--gold);color:#2A2100}
.msg.you{border-left-color:var(--blue);background:var(--blue-50)}
.msg.you .who{background:var(--blue);color:#fff}
.msg.sys{background:transparent;border-style:dashed;border-left-style:dashed;color:var(--muted)}
.msg.sys .who{background:#E4E8EF;color:var(--muted)}
.msg p{margin:0;font-size:16px}
.msg ul{margin:6px 0;padding-left:20px}
.msg.ans{margin-left:24px}

.prompt{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:6px 0 10px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;transition:border-color .15s, background .15s}
.ch:hover:not([disabled]){border-color:var(--blue);background:var(--blue-50)}
.ch .k{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.1em;background:var(--blue-50);color:var(--blue);border-radius:3px;padding:4px 8px}
.ch[disabled]{opacity:.5;cursor:default}
.ch[disabled] .k{background:var(--green);color:#fff}
.ch.rec .k{background:#FFF1BF;color:#5C4500}
.ch.next{border-color:var(--blue);background:var(--blue-50)}
.ch.next .k{background:var(--blue);color:#fff}
.ch.picked[disabled]{opacity:1;border-color:var(--gold);background:#FFFCF2}
.ch.picked[disabled] .k{background:var(--gold);color:#2A2100}

/* outcome */
.out{max-width:620px;margin:6vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px 34px;text-align:center}
.out .eyebrow{margin-bottom:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 12px;border-radius:3px;color:#fff;margin-bottom:16px}
.pill.kept{background:var(--green)} .pill.ret{background:var(--red)}
.out h2{font-size:22px;margin-bottom:12px}
.out p{color:var(--muted);font-size:16px;margin:0 0 22px}
.acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.out .done{color:var(--text);font-size:15px;border-top:1px solid var(--line);padding-top:16px}

/* final */
.big{display:flex;justify-content:center;gap:14px;margin:22px 0}
.big div{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:14px 26px}
.big b{display:block;font:700 42px/1 Inter,sans-serif}
.big .kept b{color:var(--green)} .big .ret b{color:var(--red)}
.big span{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.recap{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 16px;margin:0 0 22px}
.recap div{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.recap div:first-child{border-top:0}
.recap .nm{font-weight:600;min-width:110px}
.recap .tv{color:var(--muted);flex:1}
.recap .t{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:3px;color:#fff}
.recap .t.kept{background:var(--green)} .recap .t.ret{background:var(--red)}

@media (max-width:860px){
  .tb-in{padding:0 16px;height:48px}
  .org .dim,.org .sep{display:none}
  .wrap{padding:0 16px 40px}
  .hdr{flex-direction:column;align-items:stretch;gap:12px;padding:16px 0 12px}
  .phases li{flex:1;text-align:center;padding:6px 4px;font-size:11px}
  .sim{grid-template-columns:1fr;gap:14px}
  .prof{position:static;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;padding:14px}
  .prof .lab0{grid-column:1 / -1;margin-bottom:6px}
  .av{margin:0;width:64px;height:64px}
  .prof .role{border:0;margin:0;padding:0}
  .tags{grid-column:1 / -1;margin-top:10px}
  .notes{grid-column:1 / -1}
  .page{padding:16px}
  .msg.ans{margin-left:12px}
  .msg p{font-size:16px}
  .center{padding:26px 20px}
  .out{padding:26px 20px;margin-top:3vh}
  .big div{padding:12px 18px}
}
</style>
</head>
<body>
<header class="topbar"><div class="tb-in">
  <div class="org"><span class="logo" aria-hidden="true"></span><span>Associate Training</span><span class="sep">/</span><span class="dim">TV Department · Sales Floor Practice</span></div>
  <div class="score" id="score" hidden aria-label="Score"><span class="kept">KEPT<b id="kept">0</b></span><span class="ret">RETURNS<b id="ret">0</b></span></div>
</div></header>
<div class="wrap">
  <div class="hdr">
    <div class="brand"><div class="k">Module 1 · The TV Wall · <span id="mode">Capstone simulator</span></div><div class="s" id="cnum"></div><a class="back" href="../../tv-wall.html">&larr; Back to case study</a></div>
    <ol class="phases" id="phases" hidden aria-label="D.I.S.C. step"><li>Discover</li><li>Inspire</li><li>Solve</li><li>Close</li></ol>
  </div>
  <div id="progwrap" hidden><div class="progl"><span id="progt"></span><b id="progp"></b></div><div class="prog" role="progressbar" aria-label="Module progress" aria-valuemin="0" aria-valuemax="100" id="prog"><i id="progbar"></i></div></div>
  <main id="main" aria-live="polite"></main>
</div>

<script>
const QUESTIONS = [
  "What is the primary lighting like in the room? Lots of windows or mostly dark?",
  "What type of content is playing the majority of the time?",
  "How is the seating arranged? Will anyone be watching from a wide angle?",
  "Are you planning to connect a next-gen gaming console or home theater audio?"
];
const INSPIRE = [
  "...doesn't force you to pull the curtains closed just to see the screen.",
  "...delivers a true cinematic feel with perfectly rich colors and infinite shadows.",
  "...provides a highly reliable, clear picture without over-complicating your daily routine.",
  "...easily cuts through the harsh overhead glare to give your patrons a perfect view."
];
const SOLVE = [
  "Instead of a standard panel that washes out, a Mini-LED uses tiny lights to actively overpower the sun while keeping the contrast sharp.",
  "Since you want a cinema experience, an OLED turns off its own pixels to give you absolute perfect black levels without any glowing.",
  "Since you just need reliable, everyday viewing, a standard LED display will give you great colors without making you pay for features you don't need.",
  "Since you want vibrant, punchy colors on a budget, a QLED will easily upgrade your viewing experience without breaking the bank."
];
// Flat vector customer portraits. They live only in the profile circle: a quick cue to who the associate is talking with.
const EYE = '#262A33', MOUTH = '#7A3B2E';
function face(skin){
  return `<circle cx="27.5" cy="29.5" r="1.4" fill="${EYE}"/><circle cx="36.5" cy="29.5" r="1.4" fill="${EYE}"/>
    <path d="M28.5 35q3.5 2.6 7 0" stroke="${MOUTH}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
}
function person({bg, skin, shade, shirt, back='', hair='', extra='', collar=''}){
  return `<rect width="64" height="64" fill="${bg}"/>${back}
    <path d="M9 66c0-14 10.5-21 23-21s23 7 23 21z" fill="${shirt}"/>${collar}
    <rect x="27" y="36" width="10" height="11" rx="4" fill="${shade}"/>
    <ellipse cx="32" cy="28" rx="11" ry="12.5" fill="${skin}"/>
    ${face(skin)}${hair}${extra}`;
}
const AV = {
  // Marcus · PC builder: gaming headset with mic
  MA: person({bg:'#DCE6F7', skin:'#8D5A3B', shade:'#76482D', shirt:'#2B3140',
    hair:`<path d="M21 27c0-10 5-15 11-15s11 5 11 15c-2-5.5-6-7.5-11-7.5s-9 2-11 7.5z" fill="#1C1611"/>`,
    extra:`<path d="M19 30a13 14.5 0 0 1 26 0" stroke="#1F2430" stroke-width="3" fill="none"/>
      <rect x="16.5" y="26.5" width="5.5" height="10" rx="2.5" fill="#0A4ABF"/><rect x="42" y="26.5" width="5.5" height="10" rx="2.5" fill="#0A4ABF"/>
      <path d="M19.5 35.5q1.5 6 9 6.5" stroke="#1F2430" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="29" cy="42" r="1.6" fill="#1F2430"/>`}),
  // Elena · busy parent: messy bun, cardigan
  EL: person({bg:'#FCEBC8', skin:'#E8B48A', shade:'#D49C72', shirt:'#4F86D2',
    collar:`<path d="M26 46l6 8 6-8" fill="#FFFFFF"/>`,
    back:`<circle cx="41" cy="13.5" r="5.5" fill="#6B4027"/>`,
    hair:`<path d="M20.5 30c-1-11 5-17.5 11.5-17.5S44.5 18 43.5 30c-1.5-6-5-9-8-9.5-3 3-9 4.5-15 9.5z" fill="#6B4027"/>
      <path d="M43 25q3 5 1 10" stroke="#6B4027" stroke-width="2" fill="none" stroke-linecap="round"/>`}),
  // Walter · retiree: grey hair at the sides, glasses, cardigan
  WA: person({bg:'#E3EBE1', skin:'#F0C6A4', shade:'#DCAE8B', shirt:'#8A6D4A',
    collar:`<path d="M25 46l7 6 7-6" fill="#E9EEF4"/>`,
    hair:`<path d="M20.5 31c-1.5-5 0-10 3-12q-1 6 .5 12z M43.5 31c1.5-5 0-10-3-12q1 6-.5 12z" fill="#C9CDD3"/>
      <path d="M24.5 24.5q3-1.5 5.5 0 M34 24.5q3-1.5 5.5 0" stroke="#AEB4BC" stroke-width="1.4" fill="none" stroke-linecap="round"/>`,
    extra:`<circle cx="27.5" cy="29.5" r="4" stroke="#3A3F48" stroke-width="1.4" fill="none"/><circle cx="36.5" cy="29.5" r="4" stroke="#3A3F48" stroke-width="1.4" fill="none"/>
      <path d="M31.5 29.5h1" stroke="#3A3F48" stroke-width="1.4"/>`}),
  // Sofia · interior designer: sleek bob, gold earrings, black turtleneck
  SO: person({bg:'#ECE6F3', skin:'#C68C66', shade:'#B07652', shirt:'#1E1E26',
    collar:`<rect x="25.5" y="42" width="13" height="6" rx="3" fill="#2C2C36"/>`,
    back:`<path d="M19 40c-2-16 3-27 13-27s15 11 13 27z" fill="#17141A"/>`,
    hair:`<path d="M20.5 28c0-9 5-14.5 11.5-14.5S43.5 19 43.5 28c-5-1.5-10-5-12-9-2 4-6 7.5-11 9z" fill="#17141A"/>`,
    extra:`<circle cx="20.6" cy="35" r="1.6" fill="#E3B341"/><circle cx="43.4" cy="35" r="1.6" fill="#E3B341"/>`}),
  // Coach Carter · sports bar owner: ball cap, short beard, polo
  CC: person({bg:'#DDEBF5', skin:'#6A4029', shade:'#57331F', shirt:'#1E6B47',
    collar:`<path d="M25 46l7 7 7-7z" fill="#FFFFFF"/><path d="M32 53v9" stroke="#174F35" stroke-width="1.2"/>`,
    hair:`<path d="M22 33q1 9 10 9.5 9-.5 10-9.5-2 4-10 4.5-8-.5-10-4.5z" fill="#2A1B12"/>`,
    extra:`<path d="M20.5 24c0-8 5-12.5 11.5-12.5S43.5 16 43.5 24z" fill="#14305E"/>
      <path d="M41 23.5q7 0 9 2.5-3 1.5-9.5 0z" fill="#0F2448"/><rect x="20.3" y="22.6" width="23.2" height="2.2" fill="#F2B600"/>
      <path d="M28.5 35q3.5 2.6 7 0" stroke="#E7B9A3" stroke-width="1.6" fill="none" stroke-linecap="round"/>`}),
};
function avatar(c){
  return `<svg viewBox="0 0 64 64" role="img" aria-label="${c.nm}, ${c.role}">${AV[c.ini]}</svg>`;
}

const TVS = ["Standard LED TV","QLED TV","Premium Mini-LED TV","Premium OLED TV"];

const C = [
 {nm:"Marcus", ini:"MA", role:"PC Builder", tags:["Hardware enthusiast","Dark room","Custom rig"],
  ans:["It's a total blackout cave. I keep the curtains drawn 24/7 so there's zero glare on my screens.",
       "I'm hooked up to my custom rig, pushing high frames on an NVIDIA GPU playing massive open-world RPGs.",
       "I'm sitting dead center in my gaming chair, about four feet from the wall.",
       "Visual response time is all I care about. Audio goes through my external DAC."],
  sum:["you game in a completely dark room","you are playing high-end RPGs on a custom PC","you sit dead center in front of the screen","you need top-tier visual response times"],
  solveR:"Exactly. When I'm in a dungeon, I want the shadows to be pitch black, not glowing grey.",
  closeR:"That sounds like exactly what my rig needs to push those graphics.",
  out:[["RETURNED","The standard LED was a massive bottleneck for his expensive graphics card. He lost trust in your advice."],
       ["RETURNED","The colors were great but the grey blacks ruined his immersion."],
       ["RETURNED","Marcus complained the blooming around his crosshairs in the dark room drove him crazy."],
       ["KEPT","Marcus is mind-blown by the absolute black levels and instant response time. Perfect recommendation."]]},
 {nm:"Elena", ini:"EL", role:"Stressed Parent", tags:["Work-from-home","Bright sunroom","Chaos"],
  ans:["South-facing windows. The sunlight bounces off absolutely everything in the room.",
       "Cartoons for the kids during the day, maybe some Netflix at night if I'm still awake.",
       "We have a huge sectional, and the kids are usually sprawled on the floor at weird angles.",
       "Whatever is easiest to use. One remote, please."],
  sum:["you deal with extreme sunlight and window glare","you mostly watch bright daytime content and cartoons","your family watches from very wide angles","you just need simple audio integration"],
  solveR:"Yes! The glare on Sunday afternoons is awful right now. We want to actually see the screen without fighting the sun.",
  closeR:"That sounds perfect. I just need it to work and be bright enough for the kids.",
  out:[["KEPT","She didn't return it, but complains the picture looks washed out. You missed out on premium margin."],
       ["KEPT","It handles the sunroom decently well, but she wishes it were just a little punchier during the day."],
       ["KEPT","Elena loves that they can finally see the screen clearly on sunny afternoons without closing the blinds."],
       ["RETURNED","The TV was too dim to fight the window glare, and she panicked about the cartoon logo causing burn-in."]]},
 {nm:"Walter", ini:"WA", role:"Budget Senior", tags:["Retiree","Static news","Fixed seating"],
  ans:["I keep the blinds drawn. Just a nice reading lamp in the corner.",
       "Just the local news, maybe some classic movies on cable when nothing else is on.",
       "My recliner is right in front of the TV. Nowhere else.",
       "No gaming. Just need the TV speakers to be loud enough to hear the dialogue."],
  sum:["your room has moderate, controlled lighting","you leave the news running constantly","you sit directly in front of the TV","you rely purely on the TV's internal speakers"],
  solveR:"Oh, that sounds lovely. My eyes aren't what they used to be, so clear and simple is best.",
  closeR:"Perfect. I just want something reliable that I don't have to worry about maintaining or overpaying for.",
  out:[["KEPT","The TV runs reliably all day. Walter is thrilled with your honest, practical recommendation."],
       ["KEPT","The colors pop nicely for his classic movies without breaking his budget."],
       ["KEPT","He likes it, but the extra brightness actually hurts his eyes at night. An unnecessary upsell."],
       ["RETURNED (ANGRY)","The news channel ticker permanently burned into the screen after 3 weeks."]]},
 {nm:"Sofia", ini:"SO", role:"Interior Designer", tags:["Luxury loft","Dim lighting","High budget"],
  ans:["Motorized blackout shades, highly controlled smart lighting. Very moody.",
       "4K architectural documentaries and atmospheric cinema. Aesthetics are everything.",
       "A low-profile designer sofa, perfectly centered in the space.",
       "Hidden surround sound system, already wired into the walls."],
  sum:["you are outfitting a dark, premium viewing room","you watch high-end cinematic content","you sit perfectly centered in the room","you use high-end professional audio"],
  solveR:"That's exactly what I'm looking for. The picture quality needs to look like art.",
  closeR:"If it delivers the absolute best picture quality possible, I'll take it.",
  out:[["RETURNED","The cheap panel made the luxury room feel incredibly cheap. She was highly disappointed."],
       ["RETURNED","The grey blacks during letterboxed movies completely ruined the aesthetic."],
       ["RETURNED","She felt the slight blooming in the dark room ruined the cinematic mood of her space."],
       ["KEPT","Sofia is blown away by the picture quality. It perfectly matches her luxury loft aesthetic."]]},
 {nm:"Coach Carter", ini:"CC", role:"Bar Owner", tags:["Sports bar","14-hour days","Neon lights"],
  ans:["Track lighting, neon signs, huge windows. It's an incredibly bright venue.",
       "Sports, 14 hours a day. And static digital menus on the side screens.",
       "Patrons are standing, sitting, and cheering from every corner of the room.",
       "We route everything through a commercial AV receiver matrix."],
  sum:["your business has incredibly bright, harsh lighting","you run sports and static menus 14 hours a day","your customers watch from every angle imaginable","you use professional AV routing hardware"],
  solveR:"Absolutely, my fans need to see the score from the back of the room through all the glare.",
  closeR:"I need durability and punch. If it cuts through the glare and lasts 14 hours a day, I'm sold.",
  out:[["RETURNED","The TV washed out completely under the bar's neon lights."],
       ["KEPT","It handles the glare decently well and provides a massive, colorful image for the patrons."],
       ["KEPT","The fans can clearly see the games from the street, driving massive foot traffic into the bar."],
       ["RETURNED (LAWSUIT)","The static scoreboards caused severe burn-in in just two weeks."]]},
];

// Every interaction is its own page with its own address (#1, #2, …).
// Back/Next and the browser's own back button move between pages; earlier pages are read-only.
const T = [];               // the run's pages, in order
let at = -1;                // page currently on screen
const $ = s => document.querySelector(s);
const main = $('#main');

function base(){
  const p = T[T.length-1];
  return p ? {i:p.i, kept:p.kept, ret:p.ret, asked:[...p.asked], phase:p.phase, results:[...p.results]}
           : {i:0, kept:0, ret:0, asked:[], phase:0, results:[]};
}
function push(page){
  T.push(Object.assign(base(), {choice:null, seen:false}, page));
  navTo(T.length-1);
}
function navTo(n, replace){
  const h = '#' + (n+1);
  if(location.hash === h) return render(n);
  if(replace){ history.replaceState(null,'',h); return render(n); }
  location.hash = h;          // hashchange renders it
}
window.addEventListener('hashchange', ()=>{
  const n = parseInt(location.hash.slice(1),10) - 1;
  if(n>=0 && n<T.length) render(n);
  else if(T.length) navTo(T.length-1, true);
  else welcome(true);
});

function header(p, show){
  $('#phases').hidden = !show; $('#score').hidden = !show;
  $('#mode').textContent = show ? 'Sales Floor' : 'Capstone simulator';
  const step = p.kind==='outcome' ? 'Result · 30-day check' : `Step ${p.phase+1} of 4 · ${['Discover','Inspire','Solve','Close'][p.phase]}`;
  $('#cnum').textContent = p.kind==='final' ? 'Shift complete' : show ? `Customer ${p.i+1} of 5: ${C[p.i].nm}` : '';
  const pct = p.kind==='final' ? 100 : show ? Math.round((p.i*5 + (p.kind==='outcome'?5:p.phase))/25*100) : 0;
  $('#progwrap').hidden = !show && p.kind!=='final';
  $('#progt').textContent = p.kind==='final' ? 'All 5 customers complete' : step;
  $('#progp').textContent = pct + '% complete';
  $('#progbar').style.width = pct + '%'; $('#prog').setAttribute('aria-valuenow', pct);
  $('#phases').querySelectorAll('li').forEach((li,k)=>{ li.className = (k<p.phase||p.kind==='outcome')?'done':k===p.phase?'cur':''; li.setAttribute('aria-current', k===p.phase?'step':'false'); });
  $('#kept').textContent = p.kept; $('#ret').textContent = p.ret;
}
function msgHTML([cls,who,body],fresh){
  return `<div class="msg ${cls}${fresh?' new':''}"><span class="who">${who}</span>${body.startsWith('<')?body:`<p>${body}</p>`}</div>`;
}
function btn(p, past, attr, cls, k, label, disabled){
  const picked = past && p.choice===attr;
  const off = disabled || past;
  return `<button class="ch ${cls}${picked?' picked':''}" ${attr} type="button" ${off?'disabled':''}><span class="k">${picked?'YOUR PICK':k}</span><span>${label}</span></button>`;
}
function pnav(n){
  const back = n>0 ? `<button class="btn ghost" data-nav="${n-1}" type="button">&larr; Back</button>` : '<span class="sp"></span>';
  const next = n<T.length-1 ? `<button class="btn ghost" data-nav="${n+1}" type="button">Next &rarr;</button>` : '<span class="sp"></span>';
  return `<nav class="pnav" aria-label="Page navigation">${back}${next}</nav>`;
}

function render(n){
  at = n;
  const p = T[n], past = n < T.length-1, fresh = !p.seen;
  p.seen = true;
  ({welcome:viewWelcome, sim:viewSim, outcome:viewOutcome, final:viewFinal})[p.kind](p, n, past, fresh);
  main.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navTo(+b.dataset.nav));
  window.scrollTo({top:0,behavior:'auto'});
  const target = !past && main.querySelector('#ctl .ch:not([disabled]), .acts .btn');
  (target || main.querySelector('#h, #pgh'))?.focus({preventScroll:true});
}

/* ---------- pages ---------- */

function welcome(replace){
  T.length = 0;
  T.push(Object.assign(base(), {kind:'welcome', choice:null, seen:false}));
  navTo(0, replace);
}
function viewWelcome(p, n, past){
  header(p, false);
  main.innerHTML = `<section class="center"><div class="eyebrow">The TV Wall · Capstone simulator</div>
    <h1 tabindex="-1" id="h">Welcome to the Floor</h1>
    <p>Knowledge is only half the battle. In this virtual experience, you'll help five customers on the sales floor. Practice the D.I.S.C. framework: Discover their needs, Inspire a vision, Solve their problem with the right hardware, and Close the sale.</p>
    <div class="disc"><div><b>D</b><span>Discover</span></div><div><b>I</b><span>Inspire</span></div><div><b>S</b><span>Solve</span></div><div><b>C</b><span>Close</span></div></div>
    <p class="hint">Ask at least 3 Discovery questions to unlock the Inspire phase. Every TV you recommend is checked 30 days later: kept or returned.</p>
    ${past?'':'<div class="acts"><button class="btn" id="go" type="button">Start virtual experience</button></div>'}
    ${T.length>1?pnav(n):''}</section>`;
  if(!past) $('#go').onclick = ()=>{ p.choice='go'; startCustomer(0); };
}

function startCustomer(i){
  push({kind:'sim', step:'greet', i, asked:[], phase:0,
        msgs:[['sys','System',`A customer is approaching the TV wall. ${C[i].nm} looks around at the screens.`]]});
}

function viewSim(p, n, past, fresh){
  const c = C[p.i];
  header(p, true);
  let ctl = '';
  if(p.step==='greet'){
    ctl = `<div class="prompt">Your move</div><div class="choices">${btn(p,past,'data-a="greet"','next','SYS','Greet the approaching customer')}</div>`;
  } else if(p.step==='discover'){
    const k = p.asked.length;
    ctl = `<div class="prompt">Ask Discovery questions · at least 3 to unlock Inspire <span aria-live="polite">(${k} of 4 asked)</span></div><div class="choices">
      ${QUESTIONS.map((q,j)=>{ const done=p.asked.includes(j); return btn(p,past,`data-q="${j}"`,'',done?'ASKED':'ASK',q,done); }).join('')}
      ${k>=3?btn(p,past,'data-a="toInspire"','next','NEXT','Summarize what you heard and move to Inspire'):''}</div>`;
  } else if(p.step==='inspire'){
    ctl = `<div class="prompt">Inspire a vision</div><div class="choices">${INSPIRE.map((t,j)=>btn(p,past,`data-in="${j}"`,'','INSPIRE',t)).join('')}</div>`;
  } else if(p.step==='solve'){
    ctl = `<div class="prompt">Solve their problem with the right hardware</div><div class="choices">${SOLVE.map((t,j)=>btn(p,past,`data-so="${j}"`,'','SOLVE',t)).join('')}</div>`;
  } else if(p.step==='close'){
    ctl = `<div class="prompt">Close the sale · recommend a TV</div><div class="choices">${TVS.map((t,j)=>btn(p,past,`data-tv="${j}"`,'rec','RECOMMEND',t)).join('')}</div>`;
  }
  const notes = p.asked.length ? `<div class="notes"><span class="lab">What you've learned</span><ul>${p.asked.map(k=>`<li>${c.sum[k]}</li>`).join('')}</ul></div>` : '';
  // this customer's conversation pages, for the page counter and dots
  const mine = T.map((q,k)=>q.kind==='sim'&&q.i===p.i?k:-1).filter(k=>k>=0);
  const pos = mine.indexOf(n)+1;
  const dots = mine.map(k=>`<i class="${k===n?'cur':k<n?'done':''}"></i>`).join('');
  main.innerHTML = `<div class="sim">
    <aside class="prof" aria-label="Customer profile"><div class="lab0">Your customer</div><div class="av">${avatar(c)}</div><div><h2>${c.nm}</h2><div class="role">${c.role}</div></div>
      <div class="tags">${c.tags.map(t=>`<span>${t}</span>`).join('')}</div>${notes}</aside>
    <section class="page" aria-label="Conversation page ${pos}">
      <div class="pagebar"><span class="pg" tabindex="-1" id="pgh">Conversation · Page <b>${pos}</b></span><span class="dots" aria-hidden="true">${dots}</span></div>
      <div class="log">${p.msgs.map(m=>msgHTML(m,fresh)).join('')}</div>
      ${past?'<p class="review">You already made this choice. Use Next to keep going.</p>':''}
      <div id="ctl">${ctl}</div>${pnav(n)}</section></div>`;
  if(!past) wire(p);
}

function wire(p){
  const c = C[p.i];
  const on = (sel, fn) => main.querySelectorAll(sel).forEach(b=>b.onclick=()=>{
    p.choice = [...b.attributes].find(a=>a.name.startsWith('data-')).name + `="${[...b.attributes].find(a=>a.name.startsWith('data-')).value}"`;
    fn(b);
  });
  on('[data-a="greet"]', ()=>push({kind:'sim', step:'discover',
    msgs:[['cust',c.nm,"Hi, I need some help deciding what TV I should buy. I'm looking for a new TV and need some guidance on what technology makes sense for me."]]}));
  on('[data-q]', b=>{
    const k = +b.dataset.q, asked = [...p.asked, k];
    push({kind:'sim', step:'discover', asked, msgs:[['you','You',QUESTIONS[k]], ['cust ans',c.nm,`${c.nm}: “${c.ans[k]}”`]]});
  });
  on('[data-a="toInspire"]', ()=>{
    const items = [...p.asked].sort().map(k=>`<li>${c.sum[k]}</li>`).join('');
    push({kind:'sim', step:'inspire', phase:1,
      msgs:[['you','You',`<p>Okay, so I understand that:</p><ul>${items}</ul><p>Is that correct?</p>`], ['cust',c.nm,"Yes, exactly! That's exactly what I'm dealing with."]]});
  });
  on('[data-in]', b=>push({kind:'sim', step:'solve', phase:2,
    msgs:[['you','You',"Awesome, based on your environment, I want to recommend a viewing experience that "+INSPIRE[+b.dataset.in].slice(3)], ['cust',c.nm,c.solveR]]}));
  on('[data-so]', b=>push({kind:'sim', step:'close', phase:3,
    msgs:[['you','You',SOLVE[+b.dataset.so]], ['cust',c.nm,c.closeR]]}));
  on('[data-tv]', b=>{
    const k = +b.dataset.tv, [status,text] = c.out[k], kept = status.startsWith('KEPT');
    push({kind:'outcome', tv:k, status, text, isKept:kept,
          kept:p.kept+(kept?1:0), ret:p.ret+(kept?0:1),
          results:[...p.results, {nm:c.nm, tv:TVS[k], status, kept}]});
  });
}

function viewOutcome(p, n, past, fresh){
  header(p, true);
  if(fresh){ const el = $(p.isKept?'#kept':'#ret'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  const last = p.i===4;
  main.innerHTML = `<section class="out"><div class="eyebrow">30 days later…</div>
    <span class="pill ${p.isKept?'kept':'ret'}">${p.status}</span>
    <h2 tabindex="-1" id="h">You recommended the ${TVS[p.tv]}.</h2><p>${p.text}</p>
    ${last?`<p class="done">Shift complete. You've helped every customer on the floor today. Excellent work applying the D.I.S.C. framework.</p>`:''}
    ${past?'':`<div class="acts">${last?'':`<button class="btn" id="next" type="button">Take next customer</button>`}<button class="btn ${last?'':'ghost'}" id="fin" type="button">Finish module</button></div>`}
    ${pnav(n)}</section>`;
  if(past) return;
  if(!last) $('#next').onclick = ()=>{ p.choice='next'; startCustomer(p.i+1); };
  $('#fin').onclick = ()=>{ p.choice='fin'; push({kind:'final'}); };
}

function viewFinal(p, n){
  header(p, false);
  main.innerHTML = `<section class="center"><div class="eyebrow">Shift complete</div>
    <h1 tabindex="-1" id="h">Congratulations!</h1><p>You have mastered the TV Wall.</p>
    <div class="big"><div class="kept"><b>${p.kept}</b><span>TVs kept</span></div><div class="ret"><b>${p.ret}</b><span>Returns</span></div></div>
    ${p.results.length?`<div class="recap">${p.results.map(r=>`<div><span class="nm">${r.nm}</span><span class="tv">${r.tv}</span><span class="t ${r.kept?'kept':'ret'}">${r.status}</span></div>`).join('')}</div>`:''}
    <p>You now understand how modern display technology works and how to use the D.I.S.C. sales model to pair each customer with their ideal panel.</p>
    <div class="acts"><button class="btn" id="re" type="button">Restart simulator</button></div>
    ${pnav(n)}</section>`;
  $('#re').onclick = ()=>welcome(false);
}

welcome(true);
</script>
</body>
</html>
