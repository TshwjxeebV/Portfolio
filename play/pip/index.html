<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%235BA85B'/%3E%3C/svg%3E"><meta name="description" content="A cozy, self-paced garden game that helps 2nd graders compare numbers using place value. By Tshwjxeeb Vaaj."><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one calm storybook card, two number crates side by side, Pip's speech bubble and big buttons underneath.
   Single daytime storybook look on purpose (like an afternoon cartoon), so colors are set explicitly. */
:root{
  color-scheme: light;
  --sky:#cfe5ea; --meadow:#bcd6a6; --paper:#fbf5e6; --paper-2:#f3ead3;
  --ink:#4a3a2c; --muted:#86745f; --line:#e2d4b6;
  --berry:#c9574f; --butter:#f2cf63; --leaf:#5e8b4c; --leaf-soft:#dbe8c9;
  --hund:#f4d6c0; --tens:#d3e5f0; --ones:#e2eecf;
  --hund-ink:#a35a32; --tens-ink:#3f6f8f; --ones-ink:#4f7a3a;
  --display:"Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --body:"Andika", "Trebuchet MS", system-ui, sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; font-family:var(--body); color:var(--ink); font-size:17px; line-height:1.45;
  background:
    radial-gradient(120% 60% at 50% 0%, #e3f0f2 0%, transparent 60%),
    linear-gradient(180deg, var(--sky) 0%, #dcecdf 55%, var(--meadow) 100%);
  background-color:var(--sky);
  padding-inline:16px; padding-block:14px 28px;
}
.wrap{max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:14px}

/* top bar */
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.brand{font-family:var(--display); font-weight:800; font-size:clamp(20px,5.4vw,26px); letter-spacing:.2px; margin:0; flex:1 1 auto; min-width:0}
.brand span{color:var(--leaf)}
.pill{
  font:700 15px var(--body); color:var(--ink); background:var(--paper); border:2px solid var(--line);
  border-radius:999px; padding:6px 12px; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
}
.pill:focus-visible,.crate:focus-visible,.btn:focus-visible,.same:focus-visible{outline:3px solid var(--berry); outline-offset:2px}
.pill.count{cursor:pointer}
.pill .n{font-variant-numeric:tabular-nums}
.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.22)}}

/* level + progress strip */
.strip{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:15px; color:var(--muted)}
.lvl{font-family:var(--display); font-weight:700; color:var(--ink)}
.dots{display:flex; gap:6px}
.dot{width:20px; height:20px; border-radius:50%; border:2px dashed #b9a98d; display:grid; place-items:center}
.dot.cur{border-style:solid; border-color:var(--ink)}
.dot svg{width:18px; height:18px}

/* storybook card */
.card{
  background:var(--paper); border:2px solid var(--line); border-radius:26px; padding:16px 12px 18px;
  box-shadow:0 2px 0 var(--line), 0 14px 30px -18px rgba(74,58,44,.45);
  position:relative; overflow:hidden;
}
.card::before{ /* soft paper grain */
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.35;
  background-image:radial-gradient(rgba(140,110,70,.12) 1px, transparent 1px);
  background-size:7px 7px;
}
.stage{position:relative; display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:stretch}
.crate{
  font:inherit; color:inherit; text-align:center; cursor:pointer; min-width:0;
  background:var(--paper-2); border:2px solid var(--line); border-radius:var(--r);
  padding:10px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:10px;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.crate:not(:disabled):hover{transform:translateY(-2px); border-color:#d2bf98}
.crate:disabled{cursor:default}
.crate.win{border-color:var(--butter); box-shadow:0 0 0 4px rgba(242,207,99,.45)}
.crate.shake{animation:shake .4s ease}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.digits{display:flex; gap:4px; justify-content:center}
.chip{
  display:flex; flex-direction:column; align-items:center; border-radius:12px; padding:4px 4px 3px; min-width:42px;
  transition:opacity .25s ease, box-shadow .25s ease, transform .25s ease;
}
.chip b{font-family:var(--display); font-weight:800; font-size:clamp(30px,9vw,42px); line-height:1}
.chip small{font-size:10.5px; font-weight:700; letter-spacing:.3px}
.p-h{background:var(--hund)} .p-h b,.p-h small{color:var(--hund-ink)}
.p-t{background:var(--tens)} .p-t b,.p-t small{color:var(--tens-ink)}
.p-o{background:var(--ones)} .p-o b,.p-o small{color:var(--ones-ink)}

.blocks{display:flex; gap:6px; justify-content:center; align-items:flex-end; min-height:64px}
.col{display:flex; flex-wrap:wrap; align-content:flex-end; justify-content:center; gap:3px; transition:opacity .25s ease}
.col.h{width:62px} .col.t{width:46px} .col.o{width:30px}
.flat{width:28px; height:28px; border-radius:3px; background-color:#e9a77f;
  background-image:linear-gradient(rgba(120,60,30,.28) 1px, transparent 1px), linear-gradient(90deg, rgba(120,60,30,.28) 1px, transparent 1px);
  background-size:2.8px 2.8px; border:1px solid #b9714a}
.rod{width:6px; height:28px; border-radius:2px; background-color:#8dbbd6;
  background-image:linear-gradient(rgba(40,80,110,.35) 1px, transparent 1px); background-size:6px 2.8px; border:1px solid #5d8eac}
.cube{width:7px; height:7px; border-radius:2px; background:#9fc77f; border:1px solid #6d9a4f}

/* focus on one place at a time */
.focus .chip, .focus .col{opacity:.32}
.focus .chip.on{opacity:1; box-shadow:0 0 0 3px var(--butter); transform:translateY(-2px)}
.focus .col.on{opacity:1}

.mid{display:flex; align-items:center; justify-content:center}
.slot{
  width:48px; height:48px; border-radius:50%; background:var(--paper); border:2px dashed #c8b590;
  display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:30px; color:var(--muted);
}
.slot.filled{border-style:solid; border-color:var(--berry); color:var(--berry); animation:chomp .5s ease}
@keyframes chomp{0%{transform:scale(.4)}55%{transform:scale(1.25)}100%{transform:scale(1)}}

/* Pip + speech */
.talk{display:flex; gap:10px; align-items:flex-end; margin-top:14px}
.pip{width:78px; flex:0 0 78px}
.pip svg{width:100%; height:auto; display:block}
.pip.hop svg{animation:hop .5s ease}
@keyframes hop{40%{transform:translateY(-8px)}}
.bubble{
  position:relative; flex:1; min-width:0; background:#fff; border:2px solid var(--line); border-radius:16px;
  padding:10px 14px; font-size:17px;
}
.bubble::after{content:""; position:absolute; left:-9px; bottom:16px; width:14px; height:14px; background:#fff;
  border-left:2px solid var(--line); border-bottom:2px solid var(--line); transform:rotate(45deg)}
.bubble strong{color:var(--berry)}

/* answer controls */
.controls{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px}
.btn,.same{
  font:700 18px var(--body); color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:16px;
  padding:10px 16px; cursor:pointer; min-height:52px; display:flex; flex-direction:column; align-items:center; gap:0;
  box-shadow:0 3px 0 var(--line); transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active,.same:active{transform:translateY(3px); box-shadow:0 0 0 var(--line)}
.btn.sym{min-width:92px}
.btn.sym b{font-family:var(--display); font-size:32px; line-height:1; color:var(--berry)}
.btn.sym small{font-size:12px; color:var(--muted); font-weight:700}
.btn.go{background:var(--leaf); border-color:#4c7540; color:#fff; box-shadow:0 3px 0 #4c7540; padding-inline:28px}

/* sparkles */
.spark{position:absolute; width:10px; height:10px; pointer-events:none; left:50%; top:45%;
  animation:fly .9s ease-out forwards}
.spark svg{width:100%; height:100%}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.3); opacity:1} 100%{transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2) rotate(140deg); opacity:0}}

/* overlays */
.veil{position:fixed; inset:0; background:rgba(74,58,44,.35); display:grid; place-items:center; padding:16px; z-index:10}
.sheet{background:var(--paper); border:2px solid var(--line); border-radius:24px; padding:20px 18px; width:100%; max-width:520px;
  max-height:calc(100% - 20px); overflow:auto; box-shadow:0 20px 40px -20px rgba(74,58,44,.6)}
.sheet h2{font-family:var(--display); font-weight:800; margin:0 0 4px; font-size:26px; text-wrap:balance}
.sheet p{margin:6px 0}
.sheet .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px}
.plots{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:12px}
.plot{aspect-ratio:1; max-width:100%; border-radius:14px; background:linear-gradient(180deg, #eef4e2 0 62%, #b98c62 62% 100%); display:grid; place-items:end center; border:2px solid var(--line); overflow:hidden}
.plot svg{width:80%; height:auto}
.plot.empty{background:linear-gradient(180deg, #f4f0e2 0 62%, #d7bf9d 62% 100%); opacity:.7}
.meter{height:12px; border-radius:99px; background:var(--paper-2); border:2px solid var(--line); overflow:hidden; margin-top:6px}
.meter i{display:block; height:100%; background:var(--leaf); border-radius:99px; transition:width .4s ease}
.big-plant{width:120px; margin:8px auto 0; display:block}
.grown ul{padding-left:20px; margin:8px 0} .grown li{margin:5px 0}
.note{font-size:14px; color:var(--muted)}
.foot{display:flex; justify-content:center; gap:10px; flex-wrap:wrap}
.link{background:none; border:0; font:700 14px var(--body); color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px}

.say-row{display:flex; gap:8px; align-items:flex-end; flex:1; min-width:0}
.hear{flex:0 0 auto; width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:#fff; cursor:pointer; display:grid; place-items:center; box-shadow:0 2px 0 var(--line)}
.hear svg{width:22px; height:22px}
.hear:focus-visible{outline:3px solid var(--berry); outline-offset:2px}
.pill[aria-pressed="true"]{background:var(--leaf-soft); border-color:#9fc77f}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.keys{font-size:14px; color:var(--muted)} .keys kbd{font:700 13px var(--body); background:#fff; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 6px}
.report{width:100%; border-collapse:collapse; margin-top:8px; font-size:15px}
.report th,.report td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line)}
.report th{font-size:13px; color:var(--muted)}
.report td.n{font-variant-numeric:tabular-nums}
body.calm .spark{display:none}
body.calm *{animation:none!important; transition:none!important}
@media (max-width:380px){
  .col.h{width:50px} .flat{width:22px;height:22px;background-size:2.2px 2.2px}
  .rod{height:22px} .chip{min-width:36px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
</style>

<div class="wrap">
  <header class="bar">
    <h1 class="brand">Pip's Number <span>Garden</span></h1>
    <button class="pill count" id="seedBtn" aria-label="Open my garden">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4 3 6 7 6 11a6 6 0 0 1-12 0c0-4 2-8 6-11z" fill="#b5803f"/><path d="M12 7c1.5 2 2 4 2 6" stroke="#f3dcb6" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <span class="n" id="seedN">0</span> seeds
    </button>
    <button class="pill" id="readBtn" aria-pressed="false" title="Pip reads every prompt out loud">Read to me</button>

  <main class="card" id="card">
    <div class="stage" id="stage">
      <button class="crate" id="crateA" data-side="a"></button>
      <div class="mid"><div class="slot" id="slot" aria-live="polite">?</div></div>
      <button class="crate" id="crateB" data-side="b"></button>
    </div>

    <div class="talk">
      <div class="pip" id="pip" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <ellipse cx="50" cy="94" rx="40" ry="7" fill="#b98c62"/>
          <path d="M28 46 Q22 20 38 18 L62 18 Q78 20 72 46" fill="#e8c66d"/>
          <ellipse cx="50" cy="20" rx="34" ry="6" fill="#d8b35a"/>
          <rect x="34" y="14" width="32" height="5" rx="2" fill="#c9574f"/>
          <ellipse cx="50" cy="64" rx="30" ry="30" fill="#8a6a52"/>
          <ellipse cx="50" cy="72" rx="18" ry="19" fill="#c9a888"/>
          <circle cx="40" cy="54" r="3.6" fill="#2e231a"/><circle cx="60" cy="54" r="3.6" fill="#2e231a"/>
          <circle cx="41.2" cy="52.8" r="1.1" fill="#fff"/><circle cx="61.2" cy="52.8" r="1.1" fill="#fff"/>
          <ellipse cx="50" cy="62" rx="6" ry="4.5" fill="#e48b8b"/>
          <circle cx="33" cy="62" r="3.5" fill="#e9a2a2" opacity=".6"/><circle cx="67" cy="62" r="3.5" fill="#e9a2a2" opacity=".6"/>
          <ellipse cx="30" cy="84" rx="8" ry="5" fill="#e6b4a0"/><ellipse cx="70" cy="84" rx="8" ry="5" fill="#e6b4a0"/>
        </svg>
      </div>
      <div class="say-row"><div class="bubble" id="say" aria-live="polite"></div><button class="hear" id="hearBtn" aria-label="Hear Pip say it"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#4a3a2c"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#4a3a2c" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></div>
    </div>

    <div class="controls" id="controls"></div>

  <div class="foot">
    <button class="link" id="gardenLink">My garden</button>
    <button class="link" id="grownLink">For grown-ups</button>

  </div>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
(function(){
const LEVELS = [
  {name:"Sprout",    hint:"two-digit numbers", digits:2},
  {name:"Seedling",  hint:"look closely at the ones", digits:2},
  {name:"Bloom",     hint:"three-digit numbers", digits:3},
  {name:"Sunflower", hint:"tricky ties", digits:3}
];
const PLANTS = ["sprout","tulip","daisy","sunflower"];
const PLACE = {3:["hundreds","tens","ones"], 2:["tens","ones"]};
const PCLASS = {hundreds:"h", tens:"t", ones:"o"};
const CHEERS = ["Yes!","You got it!","Nice looking!","Wonderful!","That's it!"];
const KEY = "pip-number-garden-v1";

const $ = id => document.getElementById(id);
let save = {seeds:0, level:0, plants:[], sound:true, calm:false, read:false, stats:{}, sets:0};
try{ const raw = localStorage.getItem(KEY); if(raw) save = Object.assign(save, JSON.parse(raw)); }catch(e){}
if(!save.stats || typeof save.stats!=="object") save.stats = {};
function stat(level){ const k = String(level); return save.stats[k] = save.stats[k] || {rounds:0, first:0, sets:0, passed:0}; }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }

let S; // round state

/* ---------- numbers ---------- */
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function pair(level){
  const r = Math.random();
  let a, b;
  if(level===0){ do{ a=rnd(10,99); b=rnd(10,99);}while(Math.floor(a/10)===Math.floor(b/10)); }
  else if(level===1){
    if(r<.15){ a=rnd(10,99); b=a; }
    else if(r<.65){ const t=rnd(1,9); do{a=t*10+rnd(0,9); b=t*10+rnd(0,9);}while(a===b); }
    else { do{ a=rnd(10,99); b=rnd(10,99);}while(Math.floor(a/10)===Math.floor(b/10)); }
  }
  else if(level===2){
    if(r<.2){ const h=rnd(1,9); do{a=h*100+rnd(0,99); b=h*100+rnd(0,99);}while(Math.floor(a/10)===Math.floor(b/10)); }
    else { do{ a=rnd(100,999); b=rnd(100,999);}while(Math.floor(a/100)===Math.floor(b/100)); }
  }
  else {
    const h=rnd(1,9);
    if(r<.4){ do{a=h*100+rnd(0,99); b=h*100+rnd(0,99);}while(Math.floor(a/10)%10===Math.floor(b/10)%10); }
    else if(r<.65){ const t=rnd(0,9); do{a=h*100+t*10+rnd(0,9); b=h*100+t*10+rnd(0,9);}while(a===b); }
    else if(r<.75){ a=rnd(100,999); b=a; }
    else { do{ a=rnd(100,999); b=rnd(100,999);}while(Math.floor(a/100)===Math.floor(b/100)); }
  }
  return [a,b];
}
const digitsOf = (n, len) => String(n).padStart(len,"0").split("").map(Number);

/* ---------- drawing ---------- */
function crateHTML(n, len){
  const d = digitsOf(n,len), names = PLACE[len];
  let chips = "", cols = "";
  names.forEach((p,i)=>{
    const c = PCLASS[p];
    chips += `<span class="chip p-${c}" data-i="${i}"><b>${d[i]}</b><small>${p}</small></span>`;
    const piece = c==="h" ? "flat" : c==="t" ? "rod" : "cube";
    cols += `<span class="col ${c}" data-i="${i}">${`<i class="${piece}"></i>`.repeat(d[i])}</span>`;
  });
  return `<span class="digits">${chips}</span><span class="blocks" aria-hidden="true">${cols}</span>`;
}
function plantSVG(kind){
  const stem = `<path d="M50 100 V58" stroke="#5e8b4c" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 80 Q34 70 30 58 Q44 60 50 74" fill="#7fae63"/><path d="M50 72 Q66 62 70 50 Q56 52 50 66" fill="#7fae63"/>`;
  if(kind==="sprout") return `<svg viewBox="0 0 100 100"><path d="M50 100 V70" stroke="#5e8b4c" stroke-width="5" stroke-linecap="round"/><path d="M50 74 Q30 70 28 54 Q46 54 50 72" fill="#8cbc6c"/><path d="M50 72 Q70 66 72 50 Q54 52 50 70" fill="#8cbc6c"/></svg>`;
  if(kind==="tulip") return `<svg viewBox="0 0 100 100">${stem}<path d="M36 40 Q36 60 50 60 Q64 60 64 40 L57 46 L50 34 L43 46 Z" fill="#e07a7a"/></svg>`;
  if(kind==="daisy"){ let p=""; for(let i=0;i<8;i++){ p+=`<ellipse cx="50" cy="30" rx="5" ry="11" fill="#fff" stroke="#e5dccb" transform="rotate(${i*45} 50 42)"/>`; }
    return `<svg viewBox="0 0 100 100">${stem}${p}<circle cx="50" cy="42" r="7" fill="#f2cf63"/></svg>`; }
  let p=""; for(let i=0;i<12;i++){ p+=`<ellipse cx="50" cy="22" rx="5" ry="12" fill="#f2c94c" transform="rotate(${i*30} 50 36)"/>`; }
  return `<svg viewBox="0 0 100 100">${stem}${p}<circle cx="50" cy="36" r="10" fill="#8a5a33"/></svg>`;
}
const LEAF_ON = `<svg viewBox="0 0 24 24"><path d="M5 19 C5 9 11 5 19 5 C19 13 15 19 5 19Z" fill="#7fae63" stroke="#5e8b4c" stroke-width="1.5"/></svg>`;
const LEAF_PRACTICE = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#e6d9bd"/></svg>`;

/* ---------- sound (starts only after a tap) ---------- */
let ac = null;
function tone(freq, start, dur, vol){
  if(!save.sound || save.calm) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime + start, o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
const sndStep = () => tone(660, 0, .18, .07);
const sndRight = () => { tone(784,0,.22); tone(988,.1,.22); tone(1319,.2,.35); };
const sndSoft = () => tone(294, 0, .3, .07);
const sndLevel = () => [523,659,784,1047,1319].forEach((f,i)=>tone(f, i*.09, .3, .1));

/* ---------- flow ---------- */
function newSet(){
  S = {round:0, results:[], level:save.level};
  newRound();
}
function newRound(){
  const [a,b] = pair(S.level);
  Object.assign(S, {a, b, len:LEVELS[S.level].digits, placeIdx:0, phase:"place", mistake:false});
  render();
}
function crateLabel(n){
  const d = digitsOf(n, S.len), names = PLACE[S.len];
  const parts = names.map((p,i)=>`${d[i]} ${d[i]===1 ? p.replace(/s$/,"") : p}`).join(", ");
  const look = S.phase==="place" ? `. Choose this number if it has more ${names[S.placeIdx]}` : "";
  return `${n}: ${parts}${look}`;
}
function sideDigit(side, i){ return digitsOf(side==="a"?S.a:S.b, S.len)[i]; }

function render(){
  const L = LEVELS[S.level];
  $("lvlName").textContent = L.name; $("lvlHint").textContent = L.hint;
  $("seedN").textContent = save.seeds;
  let dots = "";
  for(let i=0;i<5;i++){
    const r = S.results[i];
    dots += `<span class="dot${i===S.round && S.phase!=="end"?" cur":""}">${r===true?LEAF_ON:r===false?LEAF_PRACTICE:""}</span>`;
  }
  $("dots").innerHTML = dots;

  const A = $("crateA"), B = $("crateB");
  A.innerHTML = crateHTML(S.a, S.len); B.innerHTML = crateHTML(S.b, S.len);
  A.setAttribute("aria-label", crateLabel(S.a)); B.setAttribute("aria-label", crateLabel(S.b));
  A.classList.remove("win"); B.classList.remove("win");
  const stage = $("stage");
  stage.classList.toggle("focus", S.phase==="place");
  stage.querySelectorAll(`[data-i="${S.placeIdx}"]`).forEach(el=>el.classList.add("on"));
  A.disabled = B.disabled = S.phase!=="place";
  const slot = $("slot");
  slot.textContent = S.sym || "?"; slot.classList.toggle("filled", !!S.sym);

  const place = PLACE[S.len][S.placeIdx];
  const c = $("controls");
  if(S.phase==="place"){
    const first = S.placeIdx===0;
    say(first
      ? `Let's start with the <strong>${place}</strong>. Which number has more ${place}? Tap it, or tap <strong>Same</strong>.`
      : `Same ${PLACE[S.len][S.placeIdx-1]}! Now look at the <strong>${place}</strong>. Which has more?`);
    c.innerHTML = `<button class="same" id="sameBtn">Same</button>`;
    $("sameBtn").onclick = () => pickPlace("same");
  } else if(S.phase==="symbol"){
    c.innerHTML = [[">","is greater than"],["<","is less than"],["=","is equal to"]]
      .map(([s,t])=>`<button class="btn sym" data-s="${s}"><b>${s}</b><small>${t}</small></button>`).join("");
    c.querySelectorAll(".sym").forEach(b=>b.onclick=()=>pickSym(b.dataset.s));
  } else if(S.phase==="next"){
    c.innerHTML = `<button class="btn go" id="goBtn">${S.round>=4?"See my garden grow":"Next numbers"}</button>`;
    $("goBtn").onclick = advance; $("goBtn").focus({preventScroll:true});
  } else { c.innerHTML = ""; }
  if(S.phase==="symbol" && document.activeElement && document.activeElement.closest && document.activeElement.closest(".stage")){
    const first = c.querySelector(".sym"); if(first) first.focus({preventScroll:true});
  }
}
function say(html){ $("say").innerHTML = html; if(save.read) speak(); }
/* ---------- read aloud (browser speech, no audio files) ---------- */
const canSpeak = "speechSynthesis" in window;
function spoken(){
  return $("say").textContent.replace(/\s+/g," ").trim()
    .replace(/>/g," is greater than ").replace(/</g," is less than ");
}
function speak(extra){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(extra || spoken());
    u.rate = 0.9; u.pitch = 1.1; u.lang = "en-US";
    speechSynthesis.speak(u);
  }catch(e){}
}

function pickPlace(choice){
  const i = S.placeIdx, da = sideDigit("a",i), db = sideDigit("b",i);
  const truth = da>db ? "a" : db>da ? "b" : "same";
  const place = PLACE[S.len][i];
  if(choice===truth){
    sndStep();
    if(truth==="same"){
      if(i < S.len-1){ S.placeIdx++; render(); return; }
      S.phase = "symbol"; S.answer = "="; render();
      say(`Every place is the same, so the numbers are <strong>equal</strong>. Pick the sign.`);
      return;
    }
    S.phase = "symbol"; S.answer = truth==="a" ? ">" : "<"; render();
    $(truth==="a"?"crateA":"crateB").classList.add("win");
    const big = truth==="a"?S.a:S.b;
    say(`Yes, <strong>${Math.max(da,db)} ${place}</strong> is more than ${Math.min(da,db)}. So <strong>${big}</strong> is bigger. Pick the sign. Its open mouth faces the bigger number.`);
  } else {
    S.mistake = true; sndSoft();
    const el = choice==="same" ? $("stage") : $(choice==="a"?"crateA":"crateB");
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    say(da===db
      ? `Look again. Both numbers have <strong>${da} ${place}</strong>. That's the same!`
      : `Let's count again. One has <strong>${da} ${place}</strong> and the other has <strong>${db}</strong>. Which is more?`);
  }
}
function pickSym(s){
  if(s===S.answer){
    S.sym = s; S.phase = "next";
    const first = !S.mistake;
    S.results[S.round] = first;
    const st = stat(S.level); st.rounds++; if(first) st.first++;
    if(first){ save.seeds++; }
    persist();
    render();
    $("crateA").classList.toggle("win", s===">"); $("crateB").classList.toggle("win", s==="<");
    const word = s===">" ? "is greater than" : s==="<" ? "is less than" : "is equal to";
    say(`<strong>${CHEERS[rnd(0,CHEERS.length-1)]}</strong> ${S.a} ${word} ${S.b}.${first?" You earned a seed.":" Good fixing. Next one!"}`);
    if(first){ sndRight(); burst(); const p=$("seedBtn"); p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop"); }
    else sndStep();
    hop();
  } else {
    S.mistake = true; sndSoft();
    say(S.answer==="="
      ? `Not quite. The numbers are the same, so we use the <strong>equal</strong> sign.`
      : `Not quite. The open mouth always faces the <strong>bigger</strong> number. Which side is bigger?`);
  }
}
function advance(){
  S.sym = null;
  if(S.round>=4){ endSet(); return; }
  S.round++; newRound();
}
function endSet(){
  const score = S.results.filter(Boolean).length;
  const kind = PLANTS[Math.min(S.level, 3)];
  const grew = Math.floor(save.seeds/5) > save.plants.length;
  while(Math.floor(save.seeds/5) > save.plants.length) save.plants.push(kind);
  let up = false;
  const st = stat(S.level); st.sets++; if(score>=4) st.passed++; save.sets = (save.sets||0) + 1;
  if(score>=4 && save.level<3){ save.level++; up = true; }
  persist();
  S.phase = "end"; render();
  if(up || score>=4) sndLevel(); else sndStep();
  const msg = score>=4
    ? (up ? `That's 80% or better. You moved up to <strong>${LEVELS[save.level].name}</strong>!` : `That's 80% or better. You're a number gardener!`)
    : `Let's practice this level once more. Getting 4 out of 5 lets you move up.`;
  sheet(`
    <h2>You got ${score} out of 5!</h2>
    ${grew ? plantSVG(save.plants[save.plants.length-1]).replace("<svg",'<svg class="big-plant"') + `<p style="text-align:center">A new <strong>${save.plants[save.plants.length-1]}</strong> grew in your garden.</p>` : ""}
    <p>${msg}</p>
    <div class="row"><button class="btn" id="viewG">My garden</button><button class="btn go" id="again">Keep playing</button></div>`);
  $("again").onclick = () => { closeSheet(); newSet(); };
  $("viewG").onclick = openGarden;
}

/* ---------- celebration ---------- */
function burst(){
  if(save.calm || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const card = $("card"), colors = ["#f2cf63","#c9574f","#7fae63","#8dbbd6"];
  for(let i=0;i<14;i++){
    const s = document.createElement("span"); s.className = "spark";
    const ang = Math.random()*Math.PI*2, dist = 60 + Math.random()*90;
    s.style.setProperty("--x", Math.cos(ang)*dist+"px"); s.style.setProperty("--y", Math.sin(ang)*dist+"px");
    s.innerHTML = `<svg viewBox="0 0 10 10"><path d="M5 0 L6.2 3.8 L10 5 L6.2 6.2 L5 10 L3.8 6.2 L0 5 L3.8 3.8Z" fill="${colors[i%4]}"/></svg>`;
    card.appendChild(s); setTimeout(()=>s.remove(), 950);
  }
}
function hop(){ const p=$("pip"); p.classList.remove("hop"); void p.offsetWidth; p.classList.add("hop"); }

/* ---------- sheets ---------- */
function sheet(html){ $("sheet").innerHTML = html; $("veil").hidden = false; }
function closeSheet(){ $("veil").hidden = true; }
$("veil").addEventListener("click", e => { if(e.target.id==="veil" && S.phase!=="end") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("veil").hidden && S.phase!=="end") closeSheet(); });

function openGarden(){
  const toNext = save.seeds % 5;
  let plots = "";
  const total = Math.max(8, Math.ceil((save.plants.length+1)/4)*4);
  for(let i=0;i<total;i++){
    const k = save.plants[i];
    plots += k ? `<div class="plot" title="${k}">${plantSVG(k)}</div>` : `<div class="plot empty"></div>`;
  }
  sheet(`
    <h2>My garden</h2>
    <p>Every first-try answer earns a seed. Five seeds grow a new plant.</p>
    <p class="note">${save.seeds} seeds · ${save.plants.length} plants · next plant in ${5-toNext} seed${5-toNext===1?"":"s"}</p>
    <div class="meter" aria-hidden="true"><i style="width:${toNext*20}%"></i></div>
    <div class="plots">${plots}</div>
    <p class="note">Sprouts grow at Sprout level, tulips at Seedling, daisies at Bloom and sunflowers at Sunflower.</p>
    <div class="row"><button class="btn go" id="closeG">Back to the numbers</button></div>`);
  $("closeG").onclick = () => { if(S.phase==="end"){ closeSheet(); newSet(); } else closeSheet(); };
}
function reportRows(){
  return LEVELS.map((L,i)=>{ const st = save.stats[String(i)] || {rounds:0, first:0, sets:0, passed:0};
    return {level:L.name, skill:L.hint, rounds:st.rounds, first:st.first, pct: st.rounds ? Math.round(st.first/st.rounds*100) : null, sets:st.sets, passed:st.passed}; });
}
function reportHTML(){
  const rows = reportRows();
  if(!rows.some(r=>r.rounds)) return `<p class="note">No rounds played yet on this device.</p>`;
  return `<table class="report"><thead><tr><th scope="col">Level</th><th scope="col">Rounds</th><th scope="col">First try</th><th scope="col">Sets passed</th></tr></thead><tbody>` +
    rows.map(r=>`<tr><th scope="row">${r.level}</th><td class="n">${r.rounds}</td><td class="n">${r.pct===null?"–":r.pct+"%"}</td><td class="n">${r.passed} of ${r.sets}</td></tr>`).join("") +
    `</tbody></table><p class="note">Current level: <strong>${LEVELS[save.level].name}</strong> · ${save.seeds} seeds · ${save.plants.length} plants</p>`;
}
function downloadReport(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [["Pip's Number Garden progress report"],["Downloaded", new Date().toLocaleString()],["Current level", LEVELS[save.level].name],["Seeds", save.seeds],["Plants", save.plants.length],[],
    ["Level","Skill","Rounds","First-try correct","First-try %","Sets played","Sets passed (4 of 5)"],
    ...reportRows().map(r=>[r.level, r.skill, r.rounds, r.first, r.pct===null?"":r.pct+"%", r.sets, r.passed])];
  const csv = lines.map(l=>l.map(q).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = `pip-progress-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function openGrown(){
  sheet(`<div class="grown">
    <h2>For grown-ups</h2>
    <p>Pip's Number Garden practices one 2nd grade skill: comparing numbers with &gt;, &lt; and =, using place value.</p>
    <ul>
      <li><strong>One place at a time.</strong> The biggest place lights up first. Students only move to the tens if the hundreds tie, then to the ones. This builds the comparison order many students skip.</li>
      <li><strong>Every place looks different.</strong> Hundreds are flats, tens are rods and ones are cubes, each with its own color and label, so places are hard to mix up.</li>
      <li><strong>Reason first, sign second.</strong> Students decide which number is bigger before they choose the sign. The open side of the sign faces the bigger number.</li>
      <li><strong>Short, calm rounds.</strong> Five comparisons per set. Students press Next when they're ready, so nothing rushes them.</li>
      <li><strong>Move up at 80%.</strong> Four of five correct on the first try unlocks the next level, from two-digit numbers up to three-digit numbers with ties.</li>
      <li><strong>Mistakes become practice.</strong> A wrong answer gets a hint and a retry. Seeds are only earned on the first try, so the garden reflects real understanding.</li>
    </ul>
    <h2 style="font-size:21px;margin-top:16px">Progress report</h2>
    <p class="note">First-try answers show real understanding, so that's what this counts. Four of five on the first try moves a student up.</p>
    ${reportHTML()}
    <h2 style="font-size:21px;margin-top:16px">Ways to play</h2>
    <ul>
      <li><strong>Read to me</strong> has Pip read every prompt and the full comparison sentence out loud. The speaker button repeats the last thing Pip said.</li>
      <li><strong>Calm mode</strong> turns off sounds, sparkles and motion.</li>
      <li class="keys"><strong>Keyboard:</strong> <kbd>←</kbd> or <kbd>A</kbd> picks the left number, <kbd>→</kbd> or <kbd>B</kbd> the right, <kbd>S</kbd> means Same. Type <kbd>&gt;</kbd> <kbd>&lt;</kbd> <kbd>=</kbd> for the sign, and <kbd>Enter</kbd> for the next numbers.</li>
    </ul>
    <p>A <a href="exit-ticket.html" target="_blank" rel="noopener">printable exit ticket</a> checks the same skill on paper after a session.</p>
    <p class="note">Progress is saved in this browser only, on this device.</p>
    <div class="row"><button class="btn" id="csvBtn">Download report</button><button class="btn" id="resetBtn">Start over</button><button class="btn go" id="closeX">Close</button></div>
  </div>`);
  $("csvBtn").onclick = downloadReport;
  $("closeX").onclick = closeSheet;
  $("resetBtn").onclick = () => {
    const b = $("resetBtn");
    if(b.dataset.armed){ save = {seeds:0, level:0, plants:[], sound:save.sound, calm:save.calm, read:save.read, stats:{}, sets:0}; persist(); closeSheet(); newSet(); }
    else { b.dataset.armed = "1"; b.textContent = "Tap again to erase the garden"; }
  };
}

$("crateA").onclick = () => pickPlace("a");
$("crateB").onclick = () => pickPlace("b");
$("seedBtn").onclick = openGarden;
$("gardenLink").onclick = openGarden;
$("grownLink").onclick = openGrown;
function syncToggles(){
  $("calmBtn").setAttribute("aria-pressed", String(!!save.calm)); $("calmBtn").textContent = save.calm ? "Calm mode on" : "Calm mode";
  document.body.classList.toggle("calm", !!save.calm);
  $("readBtn").setAttribute("aria-pressed", String(!!save.read)); $("readBtn").textContent = save.read ? "Reading to me" : "Read to me";
  if(!canSpeak){ $("readBtn").hidden = true; $("hearBtn").hidden = true; }
}
$("calmBtn").onclick = () => { save.calm = !save.calm; persist(); syncToggles(); };
$("readBtn").onclick = () => { save.read = !save.read; persist(); syncToggles(); if(save.read) speak(); else if(canSpeak) speechSynthesis.cancel(); };
$("hearBtn").onclick = () => speak();
syncToggles();
document.addEventListener("keydown", e => {
  if(!$("veil").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if(S.phase==="place"){
    if(k==="ArrowLeft" || k==="a" || k==="A"){ e.preventDefault(); pickPlace("a"); }
    else if(k==="ArrowRight" || k==="b" || k==="B"){ e.preventDefault(); pickPlace("b"); }
    else if(k==="s" || k==="S" || k==="="){ e.preventDefault(); pickPlace("same"); }
  } else if(S.phase==="symbol"){
    if(k===">" || k==="<" || k==="="){ e.preventDefault(); pickSym(k); }
  }
});

newSet();
})();
</script>
